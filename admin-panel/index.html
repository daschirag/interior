<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <script>
      // A page cached from an earlier deploy points at asset files that no longer exist:
      // reload once to fetch the current index.html instead of staying blank.
      // Reloads only after the guard is stored, so blocked storage can never cause a loop.
      window.addEventListener("error", function (e) {
        var t = e.target, url = t && (t.src || t.href);
        if (!url || !/\/assets\//.test(url)) return;
        try {
          var last = +sessionStorage.getItem("assetReloadAt") || 0;
          if (Date.now() - last < 10000) return;
          sessionStorage.setItem("assetReloadAt", String(Date.now()));
          location.reload();
        } catch (err) {}
      }, true);
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>Vinayak Interiors Admin Panel</title>

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
